services:
  - type: web
    name: inhouse-tx
    runtime: python
    plan: free
    region: singapore
    repo: https://github.com/ESpoorthy/inhouseTX-Tech4Good
    branch: main
    buildCommand: pip install -r requirements.txt && pip install gunicorn
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 api.app:app
    healthCheckPath: /api/ready
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: inhouse-tx-postgres
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYPAL_MODE
        value: sandbox
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: PAYPAL_CLIENT_ID
        sync: false
        value: ""
      - key: PAYPAL_CLIENT_SECRET
        sync: false
        value: ""
      - key: PAYPAL_WEBHOOK_ID
        sync: false
        value: ""
      - key: FRONTEND_ORIGIN
        value: https://inhouse-tx-mkmu.onrender.com
      - key: AI_PROVIDER
        value: deterministic
      - key: LOW_CONFIDENCE_THRESHOLD
        value: "0.55"
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
